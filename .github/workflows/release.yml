# Publica uma nova versão quando é criada uma tag "v*" (ex.: v1.0.1).
# A app instalada deteta esta Release e oferece a atualização automaticamente.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pastas das plataformas
        run: |
          flutter create --platforms=android,windows --org com.opaxpk --project-name partilha_ecra .
          python3 scripts/setup_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta o segredo ANDROID_KEYSTORE_BASE64. Sem a mesma chave, as atualizações do APK não instalam por cima."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
      - name: Compilar APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --build-name="$VERSION" --build-number=${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/PartilhaEcra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/PartilhaEcra.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pastas das plataformas
        run: |
          flutter create --platforms=android,windows --org com.opaxpk --project-name partilha_ecra .
          python scripts/setup_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Compilar EXE
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build windows --release --build-name="$VERSION" --build-number=${{ github.run_number }}
      - name: Criar instalador e ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          choco install innosetup -y --no-progress | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\PartilhaEcra.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\PartilhaEcra-Windows-Portatil.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
