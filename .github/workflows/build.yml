# Compila a app a cada alteração (sem publicar). Os ficheiros ficam em "Artifacts" na página da execução.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pastas das plataformas
        run: |
          flutter create --platforms=android,windows --org com.opaxpk --project-name partilha_ecra .
          python3 scripts/setup_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Análise do código
        run: flutter analyze --no-fatal-infos
      - name: Testes
        run: flutter test
      - name: Compilar APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PartilhaEcra-android-teste
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pastas das plataformas
        run: |
          flutter create --platforms=android,windows --org com.opaxpk --project-name partilha_ecra .
          python scripts/setup_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Compilar EXE
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: PartilhaEcra-windows-teste
          path: build/windows/x64/runner/Release/
