# Compila a app a cada alteração (sem publicar). Os ficheiros ficam em "Artifacts" na página da execução.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pastas das plataformas
        run: |
          flutter create --platforms=android,windows --org com.opaxpk --project-name partilha_ecra .
          python3 scripts/setup_platforms.py
          flutter pub get
          python3 scripts/patch_webrtc.py
          dart run flutter_launcher_icons
      - name: Análise do código
        run: flutter analyze --no-fatal-infos
      - name: Testes
        run: flutter test
      - name: Compilar APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Resumo do erro
        if: failure()
        run: |
          msg=$(grep -iE "error|what went wrong|exception|failed|unresolved|e: " build.log | grep -v "^\s*at " | tail -45 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Erro Android::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: PartilhaEcra-android-teste
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pastas das plataformas
        run: |
          flutter create --platforms=android,windows --org com.opaxpk --project-name partilha_ecra .
          python scripts/setup_platforms.py
          flutter pub get
          python scripts/patch_webrtc.py
          dart run flutter_launcher_icons
      - name: Compilar EXE
        run: flutter build windows --release
      - name: Testar instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.0.0" installer\PartilhaEcra.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: PartilhaEcra-windows-teste
          path: dist/PartilhaEcra-Setup.exe
