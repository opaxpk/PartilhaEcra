name: partilha_ecra
description: "PartilhaEcra — partilha de ecrã rápida em rede local (Wi-Fi ou cabo) entre Android e Windows."
publish_to: 'none'

# A versão real de cada lançamento vem da tag do GitHub (ex.: v1.2.0).
version: 1.2.0+13

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.2
  package_info_plus: ^10.2.0
  http: ^1.2.0
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  shared_preferences: ^2.5.0
  window_manager: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 23
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
